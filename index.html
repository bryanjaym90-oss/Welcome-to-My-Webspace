<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#MyFirstCode | Goodwall x GitHub</title>
<style>
  /* ============ RESET ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ============ TOKENS ============
     Every theme is one attribute swap on <body>.
     Nothing below duplicates markup — only variables change. */
  :root {
    --radius: 12px;
    --dur: .25s;
  }

  body[data-theme="dark"] {
    --bg: #0d1117; --bg2: #161b22; --border: #30363d;
    --ink: #c9d1d9; --ink-strong: #f0f6fc; --ink-soft: #8b949e;
    --accent: #3fb950; --accent-strong: #2ea043; --accent-press: #238636;
    --accent-soft: rgba(46,160,67,.15); --accent-border: rgba(46,160,67,.4);
    --term-ink: #58a6ff; --term-bg: #0d1117; --shadow: rgba(0,0,0,.4);
    --field: radial-gradient(700px 500px at 15% 10%, rgba(63,185,80,.10), transparent 60%),
             radial-gradient(900px 700px at 85% 90%, rgba(88,166,255,.08), transparent 60%);
  }

  body[data-theme="light"] {
    --bg: #e0e4e8; --bg2: #ffffff; --border: #a0a8b0;
    --ink: #111111; --ink-strong: #000000; --ink-soft: #4a5568;
    --accent: #1a7f37; --accent-strong: #166b2e; --accent-press: #145c27;
    --accent-soft: rgba(26,127,55,.10); --accent-border: rgba(26,127,55,.35);
    --term-ink: #0969da; --term-bg: #eef2f6; --shadow: rgba(31,35,40,.18);
    --field: radial-gradient(700px 500px at 15% 10%, rgba(26,127,55,.06), transparent 60%),
             radial-gradient(900px 700px at 85% 90%, rgba(9,105,218,.05), transparent 60%);
  }

  body[data-theme="red"] {
    --bg: #4a0d0d; --bg2: #241212; --border: #ff8787;
    --ink: #ffcccc; --ink-strong: #ff7f7f; --ink-soft: #e8c9c9;
    --accent: #ff6b6b; --accent-strong: #ff8787; --accent-press: #e84c4c;
    --accent-soft: rgba(255,107,107,.15); --accent-border: rgba(255,107,107,.4);
    --term-ink: #ff9b9b; --term-bg: #150a0a; --shadow: rgba(0,0,0,.45);
    --field: radial-gradient(700px 500px at 20% 0%, rgba(255,107,107,.14), transparent 60%),
             radial-gradient(900px 700px at 90% 100%, rgba(232,76,76,.10), transparent 60%);
  }

  body[data-theme="blue"] {
    --bg: #1a365d; --bg2: #10192c; --border: #7cc7ff;
    --ink: #d0e4ff; --ink-strong: #add8e6; --ink-soft: #a5c4f4;
    --accent: #4d9fff; --accent-strong: #6cb2ff; --accent-press: #2f86ee;
    --accent-soft: rgba(77,159,255,.15); --accent-border: rgba(77,159,255,.4);
    --term-ink: #7cc7ff; --term-bg: #060d19; --shadow: rgba(0,0,0,.45);
    --field: radial-gradient(700px 500px at 15% 5%, rgba(77,159,255,.14), transparent 60%),
             radial-gradient(900px 700px at 90% 95%, rgba(47,134,238,.10), transparent 60%);
  }

  body[data-theme="amber"] {
    --bg: #3d260a; --bg2: #271b0a; --border: #ffbf6b;
    --ink: #fae1bb; --ink-strong: #fff9ee; --ink-soft: #d2b48c;
    --accent: #f0a83c; --accent-strong: #f5bb5f; --accent-press: #d8901f;
    --accent-soft: rgba(240,168,60,.15); --accent-border: rgba(240,168,60,.4);
    --term-ink: #ffbf6b; --term-bg: #160f06; --shadow: rgba(0,0,0,.45);
    --field: radial-gradient(700px 500px at 20% 0%, rgba(240,168,60,.14), transparent 60%),
             radial-gradient(900px 700px at 90% 100%, rgba(216,144,31,.10), transparent 60%);
  }

  body[data-theme="green"] {
    --bg: #0f2e1b; --bg2: #0f2417; --border: #7cf0ac;
    --ink: #d1f5df; --ink-strong: #ffffff; --ink-soft: #a2dec0;
    --accent: #34d17e; --accent-strong: #5bdd99; --accent-press: #21ab63;
    --accent-soft: rgba(52,209,126,.15); --accent-border: rgba(52,209,126,.4);
    --term-ink: #7cf0ac; --term-bg: #061209; --shadow: rgba(0,0,0,.45);
    --field: radial-gradient(700px 500px at 15% 10%, rgba(52,209,126,.14), transparent 60%),
             radial-gradient(900px 700px at 90% 95%, rgba(33,171,99,.10), transparent 60%);
  }

  body[data-theme="indigo"] {
    --bg: #1f1947; --bg2: #201647; --border: #00ffff;
    --ink: #ded9ff; --ink-strong: #00ffff; --ink-soft: #b8b0e8;
    --accent: #7c6cf0; --accent-strong: #9686f5; --accent-press: #6250d8;
    --accent-soft: rgba(124,108,240,.15); --accent-border: rgba(124,108,240,.4);
    --term-ink: #a99bff; --term-bg: #0b0919; --shadow: rgba(0,0,0,.45);
    --field: radial-gradient(700px 500px at 20% 5%, rgba(124,108,240,.16), transparent 60%),
             radial-gradient(900px 700px at 88% 95%, rgba(98,80,216,.10), transparent 60%);
  }

  body[data-theme="violet"] {
    --bg: #36174a; --bg2: #26122f; --border: #a97e27;
    --ink: #f2d4ff; --ink-strong: #a97e27; --ink-soft: #d0a4e8;
    --accent: #cd6bf0; --accent-strong: #d787f5; --accent-press: #b34cd8;
    --accent-soft: rgba(205,107,240,.15); --accent-border: rgba(205,107,240,.4);
    --term-ink: #e29bff; --term-bg: #140a19; --shadow: rgba(0,0,0,.45);
    --field: radial-gradient(700px 500px at 15% 0%, rgba(205,107,240,.14), transparent 60%),
             radial-gradient(900px 700px at 90% 100%, rgba(179,76,216,.10), transparent 60%);
  }

  body[data-theme="pink"] {
    --bg: #5c1d35; --bg2: #8a324c; --border: #f088b6;
    --ink: #ffd1e3; --ink-strong: #e75480; --ink-soft: #f5a8c7;
    --accent: #ec6ea3; --accent-strong: #f088b6; --accent-press: #d95891; 
    --accent-soft: rgba(236,110,163,.12); --accent-border: rgba(236,110,163,.35);
    --term-ink: #c2478a; --term-bg: #fde8f0; --shadow: rgba(122,47,77,.14);
    --field: radial-gradient(700px 500px at 15% 5%, rgba(236,110,163,.10), transparent 60%),
             radial-gradient(900px 700px at 90% 95%, rgba(217,88,145,.07), transparent 60%);
  }

  body[data-theme="neutral"] {
    --bg: #38372f; --bg2: #26261f; --border: #cabf95;
    --ink: #f2f1e6; --ink-strong: #ffffff; --ink-soft: #c8c6b3;
    --accent: #b8ab7a; --accent-strong: #c9bd91; --accent-press: #a19361;
    --accent-soft: rgba(184,171,122,.15); --accent-border: rgba(184,171,122,.4);
    --term-ink: #cabf95; --term-bg: #161610; --shadow: rgba(0,0,0,.4);
    --field: radial-gradient(700px 500px at 20% 10%, rgba(184,171,122,.10), transparent 60%),
             radial-gradient(900px 700px at 88% 92%, rgba(161,147,97,.08), transparent 60%);
  }

  /* ============ BASE ============ */
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg);
    background-image: var(--field);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px 16px 40px;
    transition: background-color var(--dur) ease, color var(--dur) ease;
  }

  /* ============ THEME RAIL ============ */
  .theme-rail {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .theme-dot {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    padding: 0;
    background: var(--swatch);
    transition: transform .15s ease, border-color var(--dur) ease, box-shadow var(--dur) ease;
    position: relative;
  }
  .theme-dot:hover { transform: translateY(-2px) scale(1.06); }
  .theme-dot:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .theme-dot[aria-pressed="true"] {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .theme-dot[aria-pressed="true"]::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent);
    opacity: .5;
  }

  /* ============ CARD ============ */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 12px 32px var(--shadow);
    transition: background-color var(--dur) ease, border-color var(--dur) ease, box-shadow var(--dur) ease;
  }
  .badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent-border);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 20px;
    transition: color var(--dur) ease, background var(--dur) ease, border-color var(--dur) ease;
  }
  h1 {
    font-size: 1.6rem;
    color: var(--ink-strong);
    margin-bottom: 12px;
    line-height: 1.3;
    transition: color var(--dur) ease;
  }
  p {
    color: var(--ink-soft);
    line-height: 1.6;
    font-size: .95rem;
    margin-bottom: 24px;
    transition: color var(--dur) ease;
  }
  
  /* Button Container alignment setup */
  .btn-container {
    display: flex;
    width: 100%;
    margin-bottom: 0;
    transition: justify-content 0.3s ease;
  }
  .btn-container.left { justify-content: flex-start; }
  .btn-container.center { justify-content: center; }
  .btn-container.right { justify-content: flex-end; }

  .btn {
    background-color: var(--accent-press);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--dur) ease, transform .1s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background-color: var(--accent-strong); }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Three dots typing/buffer animation */
  .dots span {
    animation: dot-blink 1.4s infinite both;
    display: inline-block;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }

  @keyframes dot-blink {
    0% { opacity: .2; }
    20% { opacity: 1; }
    100% { opacity: .2; }
  }

  /* ============ TERMINAL — signature element ============ */
  .terminal-text {
    font-family: 'SFMono-Regular', Consolas, monospace;
    background: var(--term-bg);
    padding: 12px;
    border-radius: 6px;
    border-left: 3px solid var(--term-ink);
    color: var(--term-ink);
    margin-top: 24px;
    font-size: .85rem;
    position: relative;
    overflow: hidden;
    transition: background var(--dur) ease, border-color var(--dur) ease, color var(--dur) ease;
  }
  .terminal-text::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom, rgba(255,255,255,.03) 0px, rgba(255,255,255,.03) 1px,
      transparent 1px, transparent 3px
    );
    pointer-events: none;
  }
  .terminal-text .cursor {
    display: inline-block;
    width: 7px; height: 1em;
    background: var(--term-ink);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    color: var(--ink-soft);
    font-size: .75rem;
    letter-spacing: .3px;
    text-align: center;
    transition: color var(--dur) ease;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  @media (max-width: 420px) {
    .card { padding: 24px 20px; }
    h1 { font-size: 1.4rem; }
    .theme-dot { width: 27px; height: 27px; }
  }
</style>
</head>
<body data-theme="dark">

  <div class="theme-rail" id="themeRail" role="group" aria-label="Theme picker"></div>

  <div class="card">
    <span class="badge">Welcome To My Webspace</span>
    <h1 id="headline">Let's Build Tomorrow, One Lines of Code at a Time</h1>
    <p id="subtext">Initializing the repository setup and stepping into the developer ecosystem. Take the risks before you lose chance.</p>

    <div class="btn-container left" id="btnContainer">
      <button class="btn" id="actionBtn" onclick="nextVision()">Envision<span class="dots"><span>.</span><span>.</span><span>.</span></span></button>
    </div>

    <div class="terminal-text" id="terminal">&gt; Status: Webspace Active<span class="cursor"></span></div>
  </div>

  <footer>©BJML — first commit</footer>

  <script>
    const data = [
      {
        title: "Let's Build Tomorrow, One Lines of Code at a Time.",
        sub: "Initializing the repository setup and stepping into the developer ecosystem. Take the risks before you lose chance.",
        log: "> Status: Webspace Active",
        btnText: "Envision",
        btnAlign: "left"
      },
      {
        title: "With Goodwall and GitHub, We Can Slay It!",
        sub: "Turn ideas into an interactive interface. You can click the color palettes to switch for another themes.",
        log: "> Status: Rendering the DOM",
        btnText: "Take Action",
        btnAlign: "center"
      },
      {
        title: "Get Yourself Ready for the Next Milestone",
        sub: "By combining modern design with a code that can solve real-world problems. Have fun making your goals success.",
        log: "> Status: Repo Ready to Commit",
        btnText: "Own It Now",
        btnAlign: "right"
      }
    ];

    let index = 0;

    function nextVision() {
      index = (index + 1) % data.length;
      document.getElementById('headline').innerText = data[index].title;
      document.getElementById('subtext').innerText = data[index].sub;
      document.getElementById('terminal').innerHTML = data[index].log + '<span class="cursor"></span>';
      
      const btn = document.getElementById('actionBtn');
      const container = document.getElementById('btnContainer');
      
      btn.innerHTML = data[index].btnText + '<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
      container.className = "btn-container " + data[index].btnAlign;
    }

    // ============ THEME SYSTEM ============
    const themes = [
      { id: 'light',   label: 'Light',   swatch: '#ffffff' },
      { id: 'dark',    label: 'Dark',    swatch: '#0d1117' },
      { id: 'red',     label: 'Red',     swatch: '#ff6b6b' },
      { id: 'blue',    label: 'Blue',    swatch: '#4d9fff' },
      { id: 'amber',   label: 'Amber',   swatch: '#f0a83c' },
      { id: 'green',   label: 'Green',   swatch: '#34d17e' },
      { id: 'indigo',  label: 'Indigo',  swatch: '#7c6cf0' },
      { id: 'violet',  label: 'Violet',  swatch: '#cd6bf0' },
      { id: 'pink',    label: 'Pastel',  swatch: '#ec6ea3' },
      { id: 'neutral', label: 'Neutral', swatch: '#b8ab7a' }
    ];

    const rail = document.getElementById('themeRail');
    const body = document.body;
    const stored = localStorage.getItem('firstcode-theme');
    let active = themes.some(t => t.id === stored) ? stored : 'dark';

    themes.forEach(t => {
      const dot = document.createElement('button');
      dot.className = 'theme-dot';
      dot.type = 'button';
      dot.title = t.label;
      dot.setAttribute('aria-label', t.label + ' theme');
      dot.setAttribute('aria-pressed', String(t.id === active));
      dot.style.setProperty('--swatch', t.swatch);
      dot.addEventListener('click', () => setTheme(t.id));
      dot.dataset.themeId = t.id;
      rail.appendChild(dot);
    });

    function setTheme(id) {
      active = id;
      body.setAttribute('data-theme', id);
      localStorage.setItem('firstcode-theme', id);
      [...rail.children].forEach(dot =>
        dot.setAttribute('aria-pressed', String(dot.dataset.themeId === id))
      );
    }

    setTheme(active);
  </script>
</body>
</html>
