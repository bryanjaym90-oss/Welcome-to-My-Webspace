<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#MyFirstCode | Goodwall x GitHub</title>
<style>
  /* ============ RESET ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ============ TOKENS ============ */
  :root {
    --radius: 12px;
    --dur: .25s;
  }

  body[data-theme="light"] {
    --bg: #ffffff; --bg2: #f6f8fa; --border: #000000;
    --ink: #000000; --ink-strong: #000000; --ink-soft: #656d76;
    --accent: #57606a; --accent-strong: #24292f; --accent-press: #1f2328;
    --accent-soft: rgba(0,0,0,.06); --accent-border: rgba(0,0,0,.2);
    --term-ink: #24292f; --term-bg: #eceff2; --shadow: rgba(0,0,0,.15);
    --swatch-bg: #ffffff; --swatch-border: #000000;
    --field: radial-gradient(700px 500px at 15% 10%, rgba(0,0,0,.04), transparent 60%);
  }

  body[data-theme="dark"] {
    --bg: #161b22; --bg2: #0d1117; --border: #ffffff;
    --ink: #ffffff; --ink-strong: #ffffff; --ink-soft: #8b949e;
    --accent: #8b949e; --accent-strong: #c9d1d9; --accent-press: #f0f6fc;
    --accent-soft: rgba(255,255,255,.1); --accent-border: rgba(255,255,255,.3);
    --term-ink: #58a6ff; --term-bg: #0d1117; --shadow: rgba(0,0,0,.5);
    --swatch-bg: #0d1117; --swatch-border: #ffffff;
    --field: radial-gradient(700px 500px at 15% 10%, rgba(255,255,255,.05), transparent 60%);
  }

  body[data-theme="lover"] {
    --bg: #5c0614; --bg2: #3d030c; --border: #ff6b81;
    --ink: #ffb6c1; --ink-strong: #ffccd5; --ink-soft: #ff8fa3;
    --accent: #2ed573; --accent-strong: #26af5d; --accent-press: #1e8e4b;
    --accent-soft: rgba(46,213,115,.15); --accent-border: rgba(46,213,115,.4);
    --term-ink: #2ed573; --term-bg: #260208; --shadow: rgba(0,0,0,.5);
    --swatch-bg: #ff6b81; --swatch-border: #ffb6c1;
    --field: radial-gradient(700px 500px at 15% 10%, rgba(46,213,115,.1), transparent 60%);
  }

  body[data-theme="blues"] {
    --bg: #031926; --bg2: #02111a; --border: #468faf;
    --ink: #70af85; --ink-strong: #e0fbfc; --ink-soft: #98c1d9;
    --accent: #f77f00; --accent-strong: #d66f00; --accent-press: #b55e00;
    --accent-soft: rgba(247,127,0,.15); --accent-border: rgba(247,127,0,.4);
    --term-ink: #468faf; --term-bg: #010b10; --shadow: rgba(0,0,0,.5);
    --swatch-bg: #468faf; --swatch-border: #031926;
    --field: radial-gradient(700px 500px at 15% 10%, rgba(247,127,0,.1), transparent 60%);
  }

  body[data-theme="choco"] {
    --bg: #2c1d11; --bg2: #1b120a; --border: #d4a373;
    --ink: #e6ccb2; --ink-strong: #faedcd; --ink-soft: #ccd5ae;
    --accent: #dda15e; --accent-strong: #bc6c25; --accent-press: #99581a;
    --accent-soft: rgba(221,161,94,.15); --accent-border: rgba(221,161,94,.4);
    --term-ink: #dda15e; --term-bg: #120b06; --shadow: rgba(0,0,0,.5);
    --swatch-bg: #d4a373; --swatch-border: #2c1d11;
    --field: radial-gradient(700px 500px at 15% 10%, rgba(221,161,94,.1), transparent 60%);
  }

  body[data-theme="nature"] {
    --bg: #1b4332; --bg2: #081c15; --border: #e63946;
    --ink: #b7e4c7; --ink-strong: #d8f3dc; --ink-soft: #95d5b2;
    --accent: #e63946; --accent-strong: #c52233; --accent-press: #a51c28;
    --accent-soft: rgba(230,57,70,.15); --accent-border: rgba(230,57,70,.4);
    --term-ink: #52b788; --term-bg: #040e0a; --shadow: rgba(0,0,0,.5);
    --swatch-bg: #e63946; --swatch-border: #b7e4c7;
    --field: radial-gradient(700px 500px at 15% 10%, rgba(230,57,70,.1), transparent 60%);
  }

  body[data-theme="party"] {
    --bg: #10002b; --bg2: #240046; --border: #00f5d4;
    --ink: #7b2cbf; --ink-strong: #e0aaff; --ink-soft: #c77dff;
    --accent: #fee440; --accent-strong: #f1c40f; --accent-press: #d4ac0d;
    --accent-soft: rgba(254,228,64,.15); --accent-border: rgba(254,228,64,.4);
    --term-ink: #00f5d4; --term-bg: #0c0021; --shadow: rgba(0,0,0,.5);
    --swatch-bg: #00f5d4; --swatch-border: #7b2cbf;
    --field: radial-gradient(700px 500px at 15% 10%, rgba(254,228,64,.1), transparent 60%);
  }

  body[data-theme="royal"] {
    --bg: #3c096c; --bg2: #240046; --border: #ff70a6;
    --ink: #e0aaff; --ink-strong: #ffffff; --ink-soft: #c77dff;
    --accent: #ff70a6; --accent-strong: #ff4d8c; --accent-press: #e63973;
    --accent-soft: rgba(255,112,166,.15); --accent-border: rgba(255,112,166,.4);
    --term-ink: #ff99c8; --term-bg: #1a0033; --shadow: rgba(0,0,0,.5);
    --swatch-bg: #ff70a6; --swatch-border: #3c096c;
    --field: radial-gradient(700px 500px at 15% 10%, rgba(255,112,166,.1), transparent 60%);
  }

  body[data-theme="sweet"] {
    --bg: #ff758c; --bg2: #ff7eb3; --border: #7b2cbf;
    --ink: #4a0e4e; --ink-strong: #fff0f3; --ink-soft: #7a1c47;
    --accent: #7b2cbf; --accent-strong: #5a189a; --accent-press: #3c096c;
    --accent-soft: rgba(123,44,191,.15); --accent-border: rgba(123,44,191,.4);
    --term-ink: #7b2cbf; --term-bg: #ffb3c6; --shadow: rgba(0,0,0,.3);
    --swatch-bg: #7b2cbf; --swatch-border: #ff758c;
    --field: radial-gradient(700px 500px at 15% 10%, rgba(123,44,191,.1), transparent 60%);
  }

  body[data-theme="neutral"] {
    --bg: #556b2f; --bg2: #384e1b; --border: #ffffff;
    --ink: #d4a373; --ink-strong: #fefae0; --ink-soft: #ccd5ae;
    --accent: #ffffff; --accent-strong: #f0f0f0; --accent-press: #dcdcdc;
    --accent-soft: rgba(255,255,255,.15); --accent-border: rgba(255,255,255,.4);
    --term-ink: #fefae0; --term-bg: #283618; --shadow: rgba(0,0,0,.5);
    --swatch-bg: #ffffff; --swatch-border: #556b2f;
    --field: radial-gradient(700px 500px at 15% 10%, rgba(255,255,255,.1), transparent 60%);
  }

  /* ============ BASE ============ */
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg);
    background-image: var(--field);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px 16px 40px;
    transition: background-color var(--dur) ease, color var(--dur) ease;
  }

  /* ============ THEME RAIL ============ */
  .theme-rail {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .theme-dot {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 2px solid var(--swatch-border);
    cursor: pointer;
    padding: 0;
    background: var(--swatch-bg);
    transition: transform .15s ease, border-color var(--dur) ease, box-shadow var(--dur) ease;
    position: relative;
  }
  .theme-dot:hover { transform: translateY(-2px) scale(1.06); }
  .theme-dot:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .theme-dot[aria-pressed="true"] {
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  /* ============ CARD ============ */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 12px 32px var(--shadow);
    transition: background-color var(--dur) ease, border-color var(--dur) ease, box-shadow var(--dur) ease;
  }
  .badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent-border);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 20px;
    transition: color var(--dur) ease, background var(--dur) ease, border-color var(--dur) ease;
  }
  h1 {
    font-size: 1.6rem;
    color: var(--ink-strong);
    margin-bottom: 12px;
    line-height: 1.3;
    transition: color var(--dur) ease;
  }
  p {
    color: var(--ink-soft);
    line-height: 1.6;
    font-size: .95rem;
    margin-bottom: 24px;
    transition: color var(--dur) ease;
  }

  /* ============ BUTTON CONTAINER & ALIGNMENT ============ */
  .btn-container {
    display: flex;
    width: 100%;
    margin-bottom: 24px;
  }
  .btn-container.align-left { justify-content: flex-start; }
  .btn-container.align-center { justify-content: center; }
  .btn-container.align-right { justify-content: flex-end; }

  .btn {
    background-color: var(--accent-press);
    color: var(--ink-strong);
    border: 1px solid var(--accent-border);
    padding: 10px 18px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background var(--dur) ease, transform .1s ease, justify-content var(--dur) ease;
  }
  .btn:hover { background-color: var(--accent-strong); }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ============ DOT LOADING ANIMATION ============ */
  .dot-flashing {
    position: relative;
    width: 6px;
    height: 6px;
    border-radius: 5px;
    background-color: currentColor;
    color: currentColor;
    animation: dot-flashing 1s infinite linear alternate;
    animation-delay: .5s;
  }
  .dot-flashing::before, .dot-flashing::after {
    content: "";
    display: inline-block;
    position: absolute;
    top: 0;
  }
  .dot-flashing::before {
    left: -10px;
    width: 6px;
    height: 6px;
    border-radius: 5px;
    background-color: currentColor;
    animation: dot-flashing 1s infinite alternate;
    animation-delay: 0s;
  }
  .dot-flashing::after {
    left: 10px;
    width: 6px;
    height: 6px;
    border-radius: 5px;
    background-color: currentColor;
    animation: dot-flashing 1s infinite alternate;
    animation-delay: 1s;
  }
  @keyframes dot-flashing {
    0% { background-color: currentColor; }
    50%, 100% { background-color: rgba(255, 255, 255, 0.2); }
  }

  /* ============ TERMINAL ============ */
  .terminal-text {
    font-family: 'SFMono-Regular', Consolas, monospace;
    background: var(--term-bg);
    padding: 12px;
    border-radius: 6px;
    border-left: 3px solid var(--term-ink);
    color: var(--term-ink);
    font-size: .85rem;
    position: relative;
    overflow: hidden;
    transition: background var(--dur) ease, border-color var(--dur) ease, color var(--dur) ease;
  }
  .terminal-text .cursor {
    display: inline-block;
    width: 7px; height: 1em;
    background: var(--term-ink);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    color: var(--ink-soft);
    font-size: .75rem;
    letter-spacing: .3px;
    text-align: center;
    transition: color var(--dur) ease;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body data-theme="dark">

  <div class="theme-rail" id="themeRail" role="group" aria-label="Theme picker"></div>

  <div class="card">
    <span class="badge">Welcome To My Codespace</span>
    <h1 id="headline">Let's Build Tomorrow, One Line at a Time</h1>
    <p id="subtext">Initializing the repository setup and stepping into the developer ecosystem.</p>

    <div class="btn-container align-left" id="btnContainer">
      <button class="btn" id="actionBtn" onclick="nextVision()">
        <span id="btnText">Envision</span>
        <span class="dot-flashing"></span>
      </button>
    </div>

    <div class="terminal-text" id="terminal">&gt; Codespace Active<span class="cursor"></span></div>
  </div>

  <footer>©BJML — first commit</footer>

  <script>
    const data = [
      {
        title: "Let's Build Tomorrow, One Line at a Time",
        sub: "Initializing the repository setup and stepping into the developer ecosystem.",
        log: "> Codespace Active",
        btnLabel: "Envision",
        align: "align-left"
      },
      {
        title: "With Goodwall and GitHub, We Can",
        sub: "Turn ideas into an interactive interface. Please click the color palettes to switch the themes.",
        log: "> DOM Elements Rendered",
        btnLabel: "Take Action",
        align: "align-center"
      },
      {
        title: "Get Ready for the Next Milestone",
        sub: "By combining modern design with a code that can solve real-world problems. Have fun making your dreams come true.",
        log: "> Repo Ready to Commit",
        btnLabel: "Own It Now",
        align: "align-right"
      }
    ];

    let index = 0;

    function nextVision() {
      index = (index + 1) % data.length;
      document.getElementById('headline').innerText = data[index].title;
      document.getElementById('subtext').innerText = data[index].sub;
      document.getElementById('terminal').innerHTML = data[index].log + '<span class="cursor"></span>';
      document.getElementById('btnText').innerText = data[index].btnLabel;
      
      const container = document.getElementById('btnContainer');
      container.className = "btn-container " + data[index].align;
    }

    // ============ THEME SYSTEM ============
    const themes = [
      { id: 'light',   label: 'Light',   swatchBg: '#ffffff', swatchBorder: '#000000' },
      { id: 'dark',    label: 'Dark',    swatchBg: '#0d1117', swatchBorder: '#ffffff' },
      { id: 'lover',   label: 'Lover',   swatchBg: '#ff6b81', swatchBorder: '#ffb6c1' },
      { id: 'blues',   label: 'Blues',   swatchBg: '#468faf', swatchBorder: '#031926' },
      { id: 'choco',   label: 'Choco',   swatchBg: '#d4a373', swatchBorder: '#2c1d11' },
      { id: 'nature',  label: 'Nature',  swatchBg: '#e63946', swatchBorder: '#b7e4c7' },
      { id: 'party',   label: 'Party',   swatchBg: '#00f5d4', swatchBorder: '#7b2cbf' },
      { id: 'royal',   label: 'Royal',   swatchBg: '#ff70a6', swatchBorder: '#3c096c' },
      { id: 'sweet',   label: 'Sweet',   swatchBg: '#7b2cbf', swatchBorder: '#ff758c' },
      { id: 'neutral', label: 'Neutral', swatchBg: '#ffffff', swatchBorder: '#556b2f' }
    ];

    const rail = document.getElementById('themeRail');
    const body = document.body;
    const stored = localStorage.getItem('firstcode-theme');
    let active = themes.some(t => t.id === stored) ? stored : 'dark';

    themes.forEach(t => {
      const dot = document.createElement('button');
      dot.className = 'theme-dot';
      dot.type = 'button';
      dot.title = t.label;
      dot.setAttribute('aria-label', t.label + ' theme');
      dot.setAttribute('aria-pressed', String(t.id === active));
      dot.style.setProperty('--swatch-bg', t.swatchBg);
      dot.style.setProperty('--swatch-border', t.swatchBorder);
      dot.addEventListener('click', () => setTheme(t.id));
      dot.dataset.themeId = t.id;
      rail.appendChild(dot);
    });

    function setTheme(id) {
      active = id;
      body.setAttribute('data-theme', id);
      localStorage.setItem('firstcode-theme', id);
      [...rail.children].forEach(dot =>
        dot.setAttribute('aria-pressed', String(dot.dataset.themeId === id))
      );
    }

    setTheme(active);
  </script>
</body>
</html>
