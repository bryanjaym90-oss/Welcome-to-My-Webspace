<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#MyFirstCode | Goodwall x GitHub</title>
<style>
  /* ============ RESET ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ============ TOKENS ============ */
  :root {
    --radius: 12px;
    --dur: .25s;
  }

  /* Light: White BG, Black Text and Gray Accent */
  body[data-theme="light"] {
    --bg: #ffffff; --bg2: #f6f8fa; --border: #d0d7de;
    --ink: #000000; --ink-strong: #000000; --ink-soft: #57606a;
    --accent: #57606a; --accent-strong: #32383f; --accent-press: #24292f;
    --accent-soft: rgba(87,96,106,.10); --accent-border: rgba(87,96,106,.35);
    --term-ink: #24292f; --term-bg: #eef2f6; --shadow: rgba(31,35,40,.12);
    --field: radial-gradient(700px 500px at 15% 10%, rgba(87,96,106,.06), transparent 60%);
  }

  /* Dark: Grayscale BG, White Text and Black Accent */
  body[data-theme="dark"] {
    --bg: #121212; --bg2: #1e1e1e; --border: #333333;
    --ink: #e0e0e0; --ink-strong: #ffffff; --ink-soft: #aaaaaa;
    --accent: #000000; --accent-strong: #222222; --accent-press: #000000;
    --accent-soft: rgba(255,255,255,.1); --accent-border: rgba(255,255,255,.3);
    --term-ink: #ffffff; --term-bg: #181818; --shadow: rgba(0,0,0,.6);
    --field: radial-gradient(700px 500px at 15% 10%, rgba(255,255,255,.05), transparent 60%);
  }

  /* Lover: Dark Red BG, Light Red Text and Pink Accent */
  body[data-theme="lover"] {
    --bg: #3b0a10; --bg2: #4d0e16; --border: #731b27;
    --ink: #ffccd5; --ink-strong: #ffe5ec; --ink-soft: #d9919f;
    --accent: #ff70a6; --accent-strong: #ff85b3; --accent-press: #e0558c;
    --accent-soft: rgba(255,112,166,.15); --accent-border: rgba(255,112,166,.4);
    --term-ink: #ff9ebb; --term-bg: #26050a; --shadow: rgba(0,0,0,.5);
    --field: radial-gradient(700px 500px at 20% 0%, rgba(255,112,166,.14), transparent 60%);
  }

  /* Blues: Dark Blue BG, Light Blue Text and Indigo Accent */
  body[data-theme="blues"] {
    --bg: #0b192c; --bg2: #1e3e62; --border: #2a4d75;
    --ink: #93c5fd; --ink-strong: #bfdbfe; --ink-soft: #60a5fa;
    --accent: #3b82f6; --accent-strong: #60a5fa; --accent-press: #2563eb;
    --accent-soft: rgba(59,130,246,.15); --accent-border: rgba(59,130,246,.4);
    --term-ink: #93c5fd; --term-bg: #07111c; --shadow: rgba(0,0,0,.5);
    --field: radial-gradient(700px 500px at 15% 5%, rgba(59,130,246,.14), transparent 60%);
  }

  /* Choco: Dark Brown BG, Orange Text and Tan Accent */
  body[data-theme="choco"] {
    --bg: #221610; --bg2: #33221a; --border: #4d3326;
    --ink: #fdba74; --ink-strong: #ffedd5; --ink-soft: #d99a6c;
    --accent: #d97706; --accent-strong: #f59e0b; --accent-press: #b45309;
    --accent-soft: rgba(217,119,6,.15); --accent-border: rgba(217,119,6,.4);
    --term-ink: #fde047; --term-bg: #140d09; --shadow: rgba(0,0,0,.5);
    --field: radial-gradient(700px 500px at 20% 0%, rgba(217,119,6,.14), transparent 60%);
  }

  /* Nature: Dark Green BG, Light Green Text and Olive Accent */
  body[data-theme="nature"] {
    --bg: #0d2318; --bg2: #143625; --border: #1e4d35;
    --ink: #86efac; --ink-strong: #bbf7d0; --ink-soft: #4ade80;
    --accent: #65a30d; --accent-strong: #84cc16; --accent-press: #4d7c0f;
    --accent-soft: rgba(101,163,13,.15); --accent-border: rgba(101,163,13,.4);
    --term-ink: #bef264; --term-bg: #08160f; --shadow: rgba(0,0,0,.5);
    --field: radial-gradient(700px 500px at 15% 10%, rgba(101,163,13,.14), transparent 60%);
  }

  /* Party: Dark Indigo BG, Cyan Text and Purple Accent */
  body[data-theme="party"] {
    --bg: #171033; --bg2: #24194d; --border: #3b2a75;
    --ink: #67e8f9; --ink-strong: #a5f3fc; --ink-soft: #22d3ee;
    --accent: #a855f7; --accent-strong: #c084fc; --accent-press: #9333ea;
    --accent-soft: rgba(168,85,247,.15); --accent-border: rgba(168,85,247,.4);
    --term-ink: #e879f9; --term-bg: #0f0a21; --shadow: rgba(0,0,0,.5);
    --field: radial-gradient(700px 500px at 20% 5%, rgba(168,85,247,.16), transparent 60%);
  }

  /* Royal: Purple BG, Dark Purple Text and Yellow Accent */
  body[data-theme="royal"] {
    --bg: #3b0764; --bg2: #581c87; --border: #6b21a8;
    --ink: #581c87; --ink-strong: #3b0764; --ink-soft: #4c1d95;
    --accent: #facc15; --accent-strong: #fde047; --accent-press: #eab308;
    --accent-soft: rgba(250,204,21,.15); --accent-border: rgba(250,204,21,.4);
    --term-ink: #fef08a; --term-bg: #2e0450; --shadow: rgba(0,0,0,.5);
    --field: radial-gradient(700px 500px at 15% 0%, rgba(250,204,21,.14), transparent 60%);
  }

  /* Sweet: Pink BG, Dark Pink Text and Purple Accent */
  body[data-theme="sweet"] {
    --bg: #fbcfe8; --bg2: #f472b6; --border: #ec4899;
    --ink: #831843; --ink-strong: #500724; --ink-soft: #9f1239;
    --accent: #7e22ce; --accent-strong: #9333ea; --accent-press: #6b21a8;
    --accent-soft: rgba(126,34,206,.15); --accent-border: rgba(126,34,206,.4);
    --term-ink: #581c87; --term-bg: #fce7f3; --shadow: rgba(131,24,67,.2);
    --field: radial-gradient(700px 500px at 15% 5%, rgba(126,34,206,.10), transparent 60%);
  }

  /* Neutral: Olive BG, Brown Text and White Accent */
  body[data-theme="neutral"] {
    --bg: #3f3f38; --bg2: #52524a; --border: #737368;
    --ink: #451a03; --ink-strong: #291102; --ink-soft: #573315;
    --accent: #ffffff; --accent-strong: #f3f4f6; --accent-press: #e5e7eb;
    --accent-soft: rgba(255,255,255,.2); --accent-border: rgba(255,255,255,.5);
    --term-ink: #ffffff; --term-bg: #2d2d27; --shadow: rgba(0,0,0,.4);
    --field: radial-gradient(700px 500px at 20% 10%, rgba(255,255,255,.10), transparent 60%);
  }

  /* ============ BASE ============ */
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg);
    background-image: var(--field);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px 16px 40px;
    transition: background-color var(--dur) ease, color var(--dur) ease;
  }

  /* ============ THEME RAIL ============ */
  .theme-rail {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .theme-dot {
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    padding: 0;
    background: var(--swatch);
    transition: transform .15s ease, border-color var(--dur) ease, box-shadow var(--dur) ease;
    position: relative;
  }
  
  /* Theme-specific transparent border mapping */
  body[data-theme="light"] .theme-dot { border: 2px solid rgba(0,0,0,0.2); }
  body[data-theme="dark"] .theme-dot { border: 2px solid rgba(255,255,255,0.2); }
  body[data-theme="lover"] .theme-dot { border: 2px solid rgba(255,112,166,0.3); }
  body[data-theme="blues"] .theme-dot { border: 2px solid rgba(79,70,229,0.3); }
  body[data-theme="choco"] .theme-dot { border: 2px solid rgba(128,128,128,0.3); }
  body[data-theme="nature"] .theme-dot { border: 2px solid rgba(217,210,133,0.3); }
  body[data-theme="party"] .theme-dot { border: 2px solid rgba(234,217,55,0.3); }
  body[data-theme="royal"] .theme-dot { border: 2px solid rgba(0,0,255,0.3); }
  body[data-theme="sweet"] .theme-dot { border: 2px solid rgba(255,0,0,0.3); }
  body[data-theme="neutral"] .theme-dot { border: 2px solid rgba(245,245,220,0.3); }

  .theme-dot:hover { transform: translateY(-2px) scale(1.06); }
  .theme-dot:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .theme-dot[aria-pressed="true"] {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  /* ============ CARD ============ */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 12px 32px var(--shadow);
    transition: background-color var(--dur) ease, border-color var(--dur) ease, box-shadow var(--dur) ease;
  }
  .badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent-border);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 20px;
    transition: color var(--dur) ease, background var(--dur) ease, border-color var(--dur) ease;
  }
  h1 {
    font-size: 1.6rem;
    color: var(--ink-strong);
    margin-bottom: 12px;
    line-height: 1.3;
    transition: color var(--dur) ease;
  }
  p {
    color: var(--ink-soft);
    line-height: 1.6;
    font-size: .95rem;
    margin-bottom: 24px;
    transition: color var(--dur) ease;
  }
  
  /* ============ BUTTON CONTAINER & ALIGNMENT ============ */
  .btn-container {
    display: flex;
    width: 100%;
    margin-bottom: 24px;
    transition: justify-content 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .btn-container.align-left { justify-content: flex-start; }
  .btn-container.align-center { justify-content: center; }
  .btn-container.align-right { justify-content: flex-end; }

  .btn {
    background-color: var(--accent-press);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--dur) ease, transform .1s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn:hover { background-color: var(--accent-strong); }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Dot loading animation */
  .dots span {
    animation: dotPulse 1.4s infinite ease-in-out both;
    display: inline-block;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dotPulse {
    0%, 80%, 100% { opacity: 0; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.2); }
  }

  /* ============ TERMINAL — signature element ============ */
  .terminal-text {
    font-family: 'SFMono-Regular', Consolas, monospace;
    background: var(--term-bg);
    padding: 12px;
    border-radius: 6px;
    border-left: 3px solid var(--term-ink);
    color: var(--term-ink);
    font-size: .85rem;
    position: relative;
    overflow: hidden;
    transition: background var(--dur) ease, border-color var(--dur) ease, color var(--dur) ease;
  }
  .terminal-text::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom, rgba(255,255,255,.03) 0px, rgba(255,255,255,.03) 1px,
      transparent 1px, transparent 3px
    );
    pointer-events: none;
  }
  .terminal-text .cursor {
    display: inline-block;
    width: 7px; height: 1em;
    background: var(--term-ink);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    color: var(--ink-soft);
    font-size: .75rem;
    letter-spacing: .3px;
    text-align: center;
    transition: color var(--dur) ease;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  @media (max-width: 420px) {
    .card { padding: 24px 20px; }
    h1 { font-size: 1.4rem; }
    .theme-dot { width: 27px; height: 27px; }
  }
</style>
</head>
<body data-theme="dark">

  <div class="theme-rail" id="themeRail" role="group" aria-label="Theme picker"></div>

  <div class="card">
    <span class="badge">Welcome To My Codespace</span>
    <h1 id="headline">Let's Build Tomorrow, One Line at a Time</h1>
    <p id="subtext">Initializing the repository setup and stepping into the developer ecosystem.</p>

    <div class="btn-container align-left" id="btnContainer">
      <button class="btn" id="actionBtn" onclick="nextVision()">Envision<span class="dots"><span>.</span><span>.</span><span>.</span></span></button>
    </div>

    <div class="terminal-text" id="terminal">&gt; Status: Codespace Active<span class="cursor"></span></div>
  </div>

  <footer>©BJML — first commit</footer>

  <script>
    const data = [
      {
        title: "Let's Build Tomorrow, One Line at a Time",
        sub: "Initializing the repository setup and stepping into the developer ecosystem.",
        log: "> Status: Codespace Active",
        btnText: "Envision",
        alignClass: "align-left"
      },
      {
        title: "With Goodwall and GitHub, We Can",
        sub: "Turn ideas into an interactive interface. Please click the color palettes to switch the themes.",
        log: "> Status: DOM Elements Rendered",
        btnText: "Take Action",
        alignClass: "align-center"
      },
      {
        title: "Get Ready for the Next Milestone",
        sub: "By combining modern design with a code that can solve real-world problems. Have fun making your dreams come true.",
        log: "> Status: Repo Ready to Commit",
        btnText: "Own It Now",
        alignClass: "align-right"
      }
    ];

    let index = 0;

    function nextVision() {
      index = (index + 1) % data.length;
      const current = data[index];
      
      document.getElementById('headline').innerText = current.title;
      document.getElementById('subtext').innerText = current.sub;
      document.getElementById('terminal').innerHTML = current.log + '<span class="cursor"></span>';
      
      // Update button text with animated dots buffer
      document.getElementById('actionBtn').innerHTML = `${current.btnText}<span class="dots"><span>.</span><span>.</span><span>.</span></span>`;
      
      // Update button seamless transition position
      const container = document.getElementById('btnContainer');
      container.className = `btn-container ${current.alignClass}`;
    }

    // ============ THEME SYSTEM ============
    const themes = [
      { id: 'light',   label: 'Light',   swatch: '#ffffff' },
      { id: 'dark',    label: 'Dark',    swatch: '#121212' },
      { id: 'lover',   label: 'Lover',   swatch: '#3b0a10' },
      { id: 'blues',   label: 'Blues',   swatch: '#0b192c' },
      { id: 'choco',   label: 'Choco',   swatch: '#221610' },
      { id: 'nature',  label: 'Nature',  swatch: '#0d2318' },
      { id: 'party',   label: 'Party',   swatch: '#171033' },
      { id: 'royal',   label: 'Royal',   swatch: '#3b0764' },
      { id: 'sweet',   label: 'Sweet',   swatch: '#fbcfe8' },
      { id: 'neutral', label: 'Neutral', swatch: '#3f3f38' }
    ];

    const rail = document.getElementById('themeRail');
    const body = document.body;
    const stored = localStorage.getItem('firstcode-theme');
    let active = themes.some(t => t.id === stored) ? stored : 'dark';

    themes.forEach(t => {
      const dot = document.createElement('button');
      dot.className = 'theme-dot';
      dot.type = 'button';
      dot.title = t.label;
      dot.setAttribute('aria-label', t.label + ' theme');
      dot.setAttribute('aria-pressed', String(t.id === active));
      dot.style.setProperty('--swatch', t.swatch);
      dot.addEventListener('click', () => setTheme(t.id));
      dot.dataset.themeId = t.id;
      rail.appendChild(dot);
    });

    function setTheme(id) {
      active = id;
      body.setAttribute('data-theme', id);
      localStorage.setItem('firstcode-theme', id);
      [...rail.children].forEach(dot =>
        dot.setAttribute('aria-pressed', String(dot.dataset.themeId === id))
      );
    }

    setTheme(active);
  </script>
</body>
</html>
