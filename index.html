<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>#MyFirstCode | Goodwall x GitHub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      background: rgba(46, 160, 67, 0.15);
      color: #3fb950;
      border: 1px solid rgba(46, 160, 67, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.6rem;
      color: #f0f6fc;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    p {
      color: #8b949e;
      line-height: 1.6;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    .btn {
      background-color: #238636;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .btn:hover { background-color: #2ea043; }
    .btn:active { transform: scale(0.98); }
    .terminal-text {
      font-family: monospace;
      background: #0d1117;
      padding: 12px;
      border-radius: 6px;
      border-left: 3px solid #58a6ff;
      color: #58a6ff;
      margin-top: 24px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">#MyFirstCode • Codespaces</span>
    <h1 id="headline">Building the Future, One Line at a Time.</h1>
    <p id="subtext">Initializing my first repository setup on GitHub and stepping into the developer ecosystem.</p>
    
    <button class="btn" onclick="nextVision()">Cycle Vision ⚡</button>
    
    <div class="terminal-text" id="terminal">> Status: Codespace Active</div>
  </div>

  <script>
    const data = [
      { 
        title: "Building the Future, One Line at a Time.", 
        sub: "Initializing my first repository setup on GitHub and stepping into the developer ecosystem.", 
        log: "> Status: Codespace Active" 
      },
      { 
        title: "Turning Ideas into Interactive Interfaces.", 
        sub: "Combining modern design with structured code to solve real-world problems.", 
        log: "> Status: DOM Elements Rendered" 
      },
      { 
        title: "Ready for the Next Milestone.", 
        sub: "Connecting with creators worldwide through Goodwall and GitHub.", 
        log: "> Status: Repository Ready to Commit 🚀" 
      }
    ];

    let index = 0;

    function nextVision() {
      index = (index + 1) % data.length;
      document.getElementById('headline').innerText = data[index].title;
      document.getElementById('subtext').innerText = data[index].sub;
      document.getElementById('terminal').innerText = data[index].log;
    }
  </script>
</body>
</html>
